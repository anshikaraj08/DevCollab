name: CI

on:
  push:
    branches: [main, master, phase-3, phase-4]
  pull_request:
    branches: [main, master, phase-3, phase-4]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    env:
      NODE_ENV: test
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/devcollab_test
      JWT_ACCESS_SECRET: test-secret-at-least-32-characters-long-key
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
      CLIENT_URL: http://localhost:5173
      CLIENT_URLS: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify environment documentation
        run: node scripts/check-env-example.js

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run backend tests
        run: npm --prefix backend test
        env:
          MONGO_URI_TEST: mongodb://127.0.0.1:27017/devcollab_test

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Run frontend tests
        run: npm --prefix frontend test -- --run

      - name: Audit production dependencies
        run: |
          npm --prefix backend audit --omit=dev --audit-level=high
          npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm --prefix frontend run build

      # Catches files missing from the production image (Render deploys this Dockerfile)
      - name: Build backend Docker image and load its modules
        run: |
          docker build -t devcollab-backend-ci backend
          docker run --rm -e NODE_ENV=production -e MONGO_URI=mongodb://127.0.0.1:1/unused -e JWT_ACCESS_SECRET=ci-image-check-secret-at-least-32-characters devcollab-backend-ci node --input-type=module -e "await import('./app.js'); await import('./sockets/createSocketServer.js'); await import('./services/digest.service.js'); console.log('image modules ok'); process.exit(0)"

