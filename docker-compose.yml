services:
  # ── MongoDB Database ──
  mongo:
    image: mongo:7.0
    container_name: devcollab-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── Backend Node.js Web Service ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcollab-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/devcollab
      JWT_ACCESS_SECRET: devcollab-local-docker-access-secret-32-chars-long
      JWT_REFRESH_SECRET: devcollab-local-docker-refresh-secret-32-chars-long
      CLIENT_URL: http://localhost
      CLIENT_URLS: http://localhost,http://localhost:80,http://localhost:5173
      COOKIE_SAMESITE: lax
      TRUST_PROXY: 1
      APP_VERSION: 1.0.0
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy

  # ── Frontend Nginx Web Server ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
        VITE_MONACO_BASE: /monaco
    container_name: devcollab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ── Optional Redis Service (Stage 5 Scale-Out) ──
  redis:
    image: redis:7-alpine
    container_name: devcollab-redis
    restart: unless-stopped
    profiles:
      - scale-out
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Optional Secondary Backend Replica (Stage 5 Scale-Out Testing) ──
  backend-replica:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcollab-backend-replica
    restart: unless-stopped
    profiles:
      - scale-out
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/devcollab
      REDIS_URL: redis://redis:6379
      INSTANCE_ID: replica-2
      JWT_ACCESS_SECRET: devcollab-local-docker-access-secret-32-chars-long
      JWT_REFRESH_SECRET: devcollab-local-docker-refresh-secret-32-chars-long
      CLIENT_URL: http://localhost
      CLIENT_URLS: http://localhost,http://localhost:80,http://localhost:5173
      COOKIE_SAMESITE: lax
      TRUST_PROXY: 1
      APP_VERSION: 1.0.0
      LOG_LEVEL: info
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo-data:
  redis-data:

