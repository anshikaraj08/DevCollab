services:
  - type: web
    name: devcollab-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      # Public URL of this backend (OAuth redirect URIs are built from it)
      - key: API_URL
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      # Render puts one proxy in front of the app; required for correct rate limiting
      - key: TRUST_PROXY
        value: 1
      # Email delivery: without smtp + SMTP_URL, verification and reset emails are only logged
      - key: MAIL_TRANSPORT
        value: smtp
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: OAuth sign-in
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Optional: AI code review (anthropic or openai)
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_EFFORT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_TOKEN
        sync: false
