services:
  - type: web
    name: devcollab-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: CLIENT_URLS
        sync: false
      - key: COOKIE_SAMESITE
        value: none
      - key: TRUST_PROXY
        value: 1
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_TOKEN
        sync: false

