<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="emerald" x1="6" y1="11" x2="13" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyan" x1="23" y1="11" x2="30" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Squircle -->
  <rect width="36" height="36" rx="9" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="url(#stroke)" stroke-width="1"/>

  <!-- Left Code Chevron (Emerald) -->
  <path d="M12.5 11.5 L6.5 18 L12.5 24.5" stroke="url(#emerald)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right Code Chevron (Cyan) -->
  <path d="M23.5 11.5 L29.5 18 L23.5 24.5" stroke="url(#cyan)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Collaborative Nexus Spark (White with Emerald Core) -->
  <path d="M18 12.5 C18 15.5 16 18 13.5 18 C16 18 18 20.5 18 23.5 C18 20.5 20 18 22.5 18 C20 18 18 15.5 18 12.5 Z" fill="#ffffff"/>
  <circle cx="18" cy="18" r="1.3" fill="#10b981"/>
</svg>
